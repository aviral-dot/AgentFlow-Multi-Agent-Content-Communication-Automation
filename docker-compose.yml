services:
  postgres:
    image: postgres:16
    container_name: agentflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: agentflow
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: agentflow_password

    ports:
      - "5432:5432"

    volumes:
      - agentflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow -d agentflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  agentflow_postgres_data:
